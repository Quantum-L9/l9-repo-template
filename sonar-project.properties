# SonarQube / SonarCloud SCAFFOLD for repos created from l9-repo-template.
#
# This template ships no first-party source, so there is no Sonar scan job in
# the template's own CI. Copy + customize this file in a real repo, then add a
# Sonar job (see l9-ci-sdk/.github/workflows/pr-checks.yml for the pattern).
#
# REQUIRED before analysis produces results — Unknown, MUST be filled (do not
# guess). Get them from your SonarCloud/SonarQube project:
sonar.projectKey=UNKNOWN_SET_SONAR_PROJECT_KEY
sonar.organization=UNKNOWN_SET_SONAR_ORGANIZATION
# For SonarCloud, uncomment:
# sonar.host.url=https://sonarcloud.io

sonar.projectName=UNKNOWN_SET_PROJECT_NAME
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=**/__pycache__/**,build/**,dist/**
sonar.coverage.exclusions=tests/**
sonar.sourceEncoding=UTF-8

plugin_version: "1.1.0"
repo_name: "l9-repo-template"
domain: "l9-gate-worker-template"

protected_paths:
  - "uv.lock"
  - "pyproject.toml"
  - ".github/workflows/*.yml"
  - ".github/governance/*.yaml"
  - ".l9/ci-pin"
  - "scripts/sync_ci_from_pack.py"
  - "scripts/bootstrap_rename.py"
  - "spec.yaml"

high_risk_commands:
  - "git push --force"
  - "rm -rf .venv"
  - "make sync-ci"

external_endpoint_policy: "STDIO_MCP_ONLY"

ci_gates:
  - "make verify"
  - "make check-rules"

test_isolation_pattern: "clear_handlers"
package_name: "l9_example_pkg"
app_entrypoint: "l9_example_pkg.app:app"
src_layout: true
python_version: "3.12"
venv_path: ".venv/bin/python"

graph_record:
  node_type: "plugin_install"
  capabilities: ["verify", "sync-ci", "rename", "render-rules", "worker-shell", "obs-optional"]
  data_governance_class: "internal"
  maintenance_owner: "Quantum-L9/platform"

plugin_version: "1.2.0"
repo_name: "l9-repo-template"
domain: "l9-python-museum"

protected_paths:
  - "uv.lock"
  - "pyproject.toml"
  - ".l9/runtime-provenance.yaml"
  - "scripts/bootstrap_rename.py"
  - "scripts/inventory_check.py"
  - "scripts/repo_hygiene_audit.py"
  - "Makefile"
  - "tools/l9_repo/**"

high_risk_commands:
  - "git push --force"
  - "rm -rf .venv"

external_endpoint_policy: "STDIO_MCP_ONLY"

ci_gates:
  - "make verify"
  - "make check-rules"
  - "make hygiene-check"

test_isolation_pattern: "none"
package_name: "l9_example_pkg"
app_entrypoint: "l9_example_pkg.app:app"
src_layout: true
python_version: "3.12"
venv_path: ".venv/bin/python"

graph_record:
  node_type: "plugin_install"
  capabilities:
    - "verify"
    - "rename"
    - "render-rules"
    - "hygiene-check"
    - "birth-runner"
    - "obs-optional"
  data_governance_class: "internal"
  maintenance_owner: "Quantum-L9/platform"

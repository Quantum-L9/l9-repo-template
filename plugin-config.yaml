plugin_version: "1.2.0"
repo_name: "l9-repo-template"
domain: "quantum-l9-python-museum"

protected_paths:
  - "uv.lock"
  - "pyproject.toml"
  - ".l9/runtime-provenance.yaml"
  - "scripts/bootstrap_rename.py"
  - "scripts/inventory_check.py"
  - "scripts/repo_hygiene_audit.py"
  - "Makefile"
  - "tools/l9_repo/**"

high_risk_commands:
  - "git push --force"
  - "rm -rf .venv"

external_endpoint_policy: "STDIO_MCP_ONLY"

ci_gates:
  - "make verify"
  - "make check-config"
  - "make check-rules"
  - "make hygiene-check"

test_isolation_pattern: "none"
package_name: "l9_example_pkg"
app_entrypoint: "l9_example_pkg.app:app"
src_layout: true
python_version: "3.12"
venv_path: ".venv/bin/python"

graph_record:
  node_type: "plugin_install"
  capabilities:
    - "verify"
    - "rename"
    - "render-rules"
    - "hygiene-check"
    - "birth-runner"
    - "obs-optional"
  # What each capability's presence is evidence OF, in this repository. A
  # capability listed here survives `scripts/reconcile_plugin_config.py` only
  # while its path exists, so a repository born without the optional stack does
  # not inherit a claim to it. A capability with no entry is unconditional.
  capability_evidence:
    verify: "Repo.mk"
    rename: "scripts/bootstrap_rename.py"
    render-rules: "scripts/render_cursor_rules.py"
    hygiene-check: "scripts/repo_hygiene_audit.py"
    birth-runner: "scripts/birth-runner/new_repo.py"
    obs-optional: "observability"
  data_governance_class: "internal"
  maintenance_owner: "Quantum-L9/platform"

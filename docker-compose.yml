services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-l9-example-pkg}-api
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      L9_ENVIRONMENT: ${L9_ENVIRONMENT:-local}
      L9_EXAMPLE_ENABLED: ${L9_EXAMPLE_ENABLED:-true}
      L9_EXAMPLE_SERVICE_NAME: ${L9_EXAMPLE_SERVICE_NAME:-l9-example-pkg}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

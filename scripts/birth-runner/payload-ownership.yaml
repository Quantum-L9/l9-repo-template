# Birth payload ownership contract.
#
# `make new-repo PAYLOAD=<dir>` has two modes, and this file is what separates
# them.
#
#   ADDITIVE OVERLAY  — a partial payload (a few files, a fragment of a tree).
#                       It adds and overrides. The template keeps everything the
#                       payload does not mention. Absence means nothing.
#
#   AUTHORITATIVE     — a repository-shaped payload: a standalone product
#                       repository, identified by `repository_shape` below. It
#                       OWNS its product tree. Absence IS meaningful: a
#                       `product` surface the payload does not supply is removed
#                       from the newborn rather than inherited from the example
#                       product this template ships.
#
# Four kinds of surface exist in an assembled newborn:
#   1. birth / chassis-owned   `chassis` below
#   2. organization-owned      Quantum-L9/.github, via MATERIALIZE in stage 4.
#                              The template copy contributes NONE of these
#                              (`org_materialize_destinations` in new_repo_legacy.py):
#                              the org's own seed builder supplies the current
#                              version, and an explicit product-payload copy
#                              still wins because MATERIALIZE is missing-only.
#   3. product-payload-owned   supplied by the payload; always wins
#   4. optional / template-demo `product` below; absent means remove under an authoritative payload
#
# `repository_shape` names ONLY surfaces a standalone product legitimately owns:
# its build declaration (`pyproject.toml`), its own architecture declaration
# (`.l9/architecture.yaml` — without it a newborn would inherit the template's
# birth-factory identity), its source (`src/`) and its tests (`tests/`). It must
# never name a template internal: a product repository cannot be required to
# copy template machinery (`scripts/inventory_check.py` was once listed and made
# every real product additive). A fragment that merely carries `src/` matches
# one of four paths and stays additive — the template-demo protection this
# list exists for.
#
# `repository_shape` is evidence for exactly one decision — whether a payload is
# ADDITIVE or AUTHORITATIVE. It is not a ProductKind, and nothing reads it as one:
# what semantic product a born repository is comes from its resolved product
# semantics upstream, never from the shape of its payload.
#
# EXECUTION RUNTIME. The template's own contract is Repository Execution V2
# (`l9.repo-execution/v2`): a three-field `.l9/repo-workflow.json`, the
# Core-generated `make-v1` facade `Makefile`, and a repository-owned `Repo.mk`.
# Its runtime is Core-owned and never vendored, so nothing executable is bound
# here any more (the V1 runtime — `tools/l9_repo/**`,
# `tools/check_workflow_integrity.py`, `.l9/repo-workflow.schema.json`,
# `.l9/runtime-provenance.yaml`, `MANIFEST.sha256`,
# `requirements-repo-runtime.txt`, `scripts/regenerate_runtime_manifest.py` —
# was retired from the template itself). `execution_runtime.bound` keeps only
# what describes the template's contract and nothing else. They stay `chassis`
# for classification. When an AUTHORITATIVE payload supplies its own contract it
# has replaced what they describe, so every bound file the payload does not
# itself supply is removed; an additive payload, or an authoritative one that
# keeps the template's contract, inherits them unchanged.
# FACTORY-ONLY. `factory` names the surfaces that exist to make or maintain this
# FACTORY and describe nothing about a product: the birth engine itself, the
# template's own agent contract (`CLAUDE.md` says "this repository is the generic
# L9 repository birth factory"), its inventory, its rule renderer and the config
# that renderer reads, its docs, and the `.l9` declarations whose `repository:`
# is the template. A newborn under an AUTHORITATIVE payload is a product, not a
# copy of the factory, so every factory surface the payload does not itself
# supply is removed from it. An additive birth still inherits them unchanged,
# because the template remains its own product there. Classification is
# disjoint: a `factory` path is neither `product` nor `chassis`.
#
# PRECEDENCE: `product` is evaluated first. A path matching both lists is
# product-owned (`docs/**` is chassis, `docs/examples/**` is product).
# PATTERN GRAMMAR: exact repository-relative path or one trailing `/**` prefix.
# This grammar governs THIS contract only; the organization's repo-class policy
# is interpreted solely by Quantum-L9/.github ops/repo-class-profile.js.
# COMPLETENESS is enforced by tests/unit/test_new_repo_orchestrator.py.
{
  "schema": "l9.birth-payload-ownership/v1",

  "repository_shape": [
    "pyproject.toml",
    ".l9/architecture.yaml",
    "src",
    "tests"
  ],

  "product": [
    "src/**",
    "tests/**",
    "observability/**",
    "docs/examples/**",
    "Dockerfile",
    "docker-compose.yml",
    ".dockerignore",
    ".env.example"
  ],

  "execution_runtime": {
    "contract": ".l9/repo-workflow.json",
    "bound": [
      "docs/repository-execution-runtime.md"
    ]
  },

  "factory": [
    ".cursor/**",
    ".devcontainer/**",
    ".l9/ownership.yaml",
    ".l9/sdk-compatibility.yaml",
    ".pre-commit-config.yaml",
    "ARCHITECTURE.md",
    "CHANGELOG.md",
    "CLAUDE.md",
    "TEMPLATE_INVENTORY.md",
    "bootstrap.sh",
    "docs/**",
    "llms.txt",
    "plugin-config.yaml",
    "scripts/**"
  ],

  "chassis": [
    ".coderabbit.yaml",
    ".editorconfig",
    ".gitattributes",
    ".github/**",
    ".gitignore",
    ".gitleaks.toml",
    ".l9/**",
    ".l9-template-version",
    ".python-version",
    ".semgrep/**",
    ".vscode/**",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "Makefile",
    "README.md",
    "Repo.mk",
    "SECURITY.md",
    "SUPPORT.md",
    "pyproject.toml",
    "uv.lock"
  ]
}

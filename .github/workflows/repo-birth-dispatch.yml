name: Repo birth (dispatch)

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Repository name, no owner prefix"
        required: true
        type: string
      package_name:
        description: "snake_case Python package name"
        required: true
        type: string
      description:
        description: "One-line repository description"
        required: true
        type: string
      visibility:
        description: "Repository visibility"
        required: true
        type: choice
        options: [private, public]
        default: private
      repo_class:
        description: "Org repo class; blank uses factory default"
        required: false
        type: string
      ci_unverified_reason:
        description: "Explicit operator reason for accepting unenrolled canonical CI"
        required: false
        type: string
      governance_ref:
        description: "Cursor-Governance ref; blank uses main"
        required: false
        type: string
      payload_repo:
        description: "owner/name containing product bytes; blank births bare template"
        required: false
        type: string
      payload_ref:
        description: "Payload ref; required with payload_repo"
        required: false
        type: string
      payload_subpath:
        description: "Relative payload directory inside checkout"
        required: false
        type: string
      payload_bundle_ref:
        description: "Full commit SHA of the payload repo carrying the birth bundle; never the payload_ref snapshot"
        required: false
        type: string
      payload_contract_path:
        description: "Relative compiled l9.birth-payload/v1 path inside the payload_bundle_ref checkout"
        required: false
        type: string
      product_birth_binding_path:
        description: "Relative l9.product-birth-binding/v2 path in the bundle checkout; both or none"
        required: false
        type: string
      product_manifest_path:
        description: "Relative resolved l9.product-manifest/v1 path in the bundle checkout; both or none"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: repo-birth-${{ inputs.repo_name }}
  cancel-in-progress: false

jobs:
  source:
    name: Fetch source for ${{ inputs.repo_name }}
    # Product bytes in a private repository are read with the factory's one
    # existing GitHub App (repo-birth environment), minted down to
    # contents:read on exactly the payload and pinned-engine repositories.
    # This job runs factory code only; PREPARE, which runs product code,
    # receives the checkouts as data and never sees the App key or a token.
    if: inputs.payload_repo != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: repo-birth
    outputs:
      payload_sha: ${{ steps.payload.outputs.sha }}
      payload_bundle_sha: ${{ steps.payload.outputs.bundle_sha }}
      semantic_compiler_sha: ${{ steps.semantic_compiler.outputs.sha }}
    steps:
      - name: Checkout factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve read-only source scope
        id: scope
        env:
          PAYLOAD_REPO: ${{ inputs.payload_repo }}
          BIRTH_ORG: ${{ github.repository_owner }}
          ADAPTER_REQUESTED: ${{ inputs.product_birth_binding_path }}
        run: |
          set -euo pipefail
          case "$PAYLOAD_REPO" in "$BIRTH_ORG"/?*) :;; *) echo "payload_repo must be in $BIRTH_ORG" >&2; exit 2;; esac
          repos="${PAYLOAD_REPO#*/}"
          case "$repos" in */*) echo "payload_repo must be owner/name" >&2; exit 2;; esac
          if [ -n "$ADAPTER_REQUESTED" ]; then
            engine="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["repository"])' scripts/birth-runner/semantic-compiler.pin.json)"
            case "$engine" in "$BIRTH_ORG"/?*) :;; *) echo "pinned semantic compiler must be in $BIRTH_ORG" >&2; exit 2;; esac
            [ "${engine#*/}" = "$repos" ] || repos="$repos,${engine#*/}"
          fi
          echo "repositories=$repos" >> "$GITHUB_OUTPUT"
      - name: Mint read-only source token from the existing birth App
        id: source_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.BIRTH_APP_ID }}
          private-key: ${{ secrets.BIRTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.scope.outputs.repositories }}
          permission-contents: read
      - name: Fetch payload with read-only source authority
        id: payload
        env:
          SOURCE_TOKEN: ${{ steps.source_token.outputs.token }}
          PAYLOAD_REPO: ${{ inputs.payload_repo }}
          PAYLOAD_REF: ${{ inputs.payload_ref }}
          PAYLOAD_SUBPATH: ${{ inputs.payload_subpath }}
          PAYLOAD_BUNDLE_REF: ${{ inputs.payload_bundle_ref }}
          PAYLOAD_CONTRACT_PATH: ${{ inputs.payload_contract_path }}
          PRODUCT_BINDING_PATH: ${{ inputs.product_birth_binding_path }}
          PRODUCT_MANIFEST_PATH: ${{ inputs.product_manifest_path }}
          BIRTH_ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          case "$PAYLOAD_REPO" in "$BIRTH_ORG"/*) :;; *) echo "payload_repo must be in $BIRTH_ORG" >&2; exit 2;; esac
          [ -n "$PAYLOAD_REF" ] || { echo "payload_ref is required" >&2; exit 2; }
          for p in "$PAYLOAD_SUBPATH" "$PAYLOAD_CONTRACT_PATH" "$PRODUCT_BINDING_PATH" "$PRODUCT_MANIFEST_PATH"; do
            case "/$p/" in */../*) echo "payload paths must not contain '..'" >&2; exit 2;; esac
            case "$p" in /*) echo "payload paths must be relative" >&2; exit 2;; esac
          done
          # Compiler-backed birth: both artifacts or none, plus the compiled
          # payload they bind. Transport only — PREPARE judges admissibility
          # and reproduces the manifest with the pinned semantic compiler.
          adapter_given=0
          for p in "$PRODUCT_BINDING_PATH" "$PRODUCT_MANIFEST_PATH"; do
            [ -z "$p" ] || adapter_given=$((adapter_given + 1))
          done
          case "$adapter_given" in
            0) :;;
            2) [ -n "$PAYLOAD_CONTRACT_PATH" ] || { echo "adapter-backed birth requires payload_contract_path" >&2; exit 2; };;
            *) echo "adapter-backed birth needs both adapter artifact paths" >&2; exit 2;;
          esac
          # The birth bundle attests the payload_ref snapshot (its commit and
          # tree), so it can never be committed inside that snapshot. It is read
          # from a second immutable ref of the SAME repository: a full commit
          # SHA that is not the snapshot. Integrity is unchanged — PREPARE
          # still reproduces the payload against the snapshot and the manifest
          # with the pinned compiler — only the bundle's location moves.
          if [ -n "$PAYLOAD_CONTRACT_PATH" ] && [ -z "$PAYLOAD_BUNDLE_REF" ]; then
            echo "payload_contract_path requires payload_bundle_ref: a bundle committed into the snapshot it pins can never name that snapshot's commit" >&2; exit 2
          fi
          if [ -n "$PAYLOAD_BUNDLE_REF" ]; then
            [ -n "$PAYLOAD_CONTRACT_PATH" ] || { echo "payload_bundle_ref carries a birth bundle: payload_contract_path is required with it" >&2; exit 2; }
            printf '%s' "$PAYLOAD_BUNDLE_REF" | grep -Eqx '[0-9a-f]{40}' || { echo "payload_bundle_ref must be a full 40-character commit SHA" >&2; exit 2; }
          fi
          dest="$RUNNER_TEMP/birth-sources/payload-src"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$header" clone --no-checkout "https://github.com/${PAYLOAD_REPO}.git" "$dest"
          git -C "$dest" -c "http.extraheader=$header" fetch --depth 1 origin "$PAYLOAD_REF"
          git -C "$dest" checkout --detach FETCH_HEAD
          sha="$(git -C "$dest" rev-parse HEAD)"
          root="$dest"; [ -z "$PAYLOAD_SUBPATH" ] || root="$dest/$PAYLOAD_SUBPATH"
          [ -d "$root" ] || { echo "payload_subpath is not a directory" >&2; exit 2; }
          bundle_dest=""; bundle_sha=""
          if [ -n "$PAYLOAD_BUNDLE_REF" ]; then
            [ "$PAYLOAD_BUNDLE_REF" != "$sha" ] || { echo "payload_bundle_ref is the payload_ref snapshot itself: the bundle must come from a different commit" >&2; exit 2; }
            bundle_dest="$RUNNER_TEMP/birth-sources/payload-bundle"
            git -c "http.extraheader=$header" clone --no-checkout "https://github.com/${PAYLOAD_REPO}.git" "$bundle_dest"
            git -C "$bundle_dest" -c "http.extraheader=$header" fetch --depth 1 origin "$PAYLOAD_BUNDLE_REF"
            git -C "$bundle_dest" checkout --detach FETCH_HEAD
            bundle_sha="$(git -C "$bundle_dest" rev-parse HEAD)"
            [ "$bundle_sha" = "$PAYLOAD_BUNDLE_REF" ] || { echo "payload bundle checkout is not payload_bundle_ref" >&2; exit 2; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "bundle_sha=$bundle_sha" >> "$GITHUB_OUTPUT"
      - name: Fetch the pinned semantic compiler with read-only source authority
        id: semantic_compiler
        if: inputs.product_birth_binding_path != ''
        env:
          SOURCE_TOKEN: ${{ steps.source_token.outputs.token }}
        run: |
          set -euo pipefail
          pin="$(python3 -I -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["repository"], d["revision"])' scripts/birth-runner/semantic-compiler.pin.json)"
          repo="${pin% *}"; sha="${pin#* }"
          dest="$RUNNER_TEMP/birth-sources/semantic-compiler"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$header" clone --no-checkout "https://github.com/${repo}.git" "$dest"
          git -C "$dest" -c "http.extraheader=$header" fetch --depth 1 origin "$sha"
          git -C "$dest" checkout --detach FETCH_HEAD
          test "$(git -C "$dest" rev-parse HEAD)" = "$sha" || { echo "semantic compiler checkout is not the pinned revision" >&2; exit 2; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Pack source checkouts as data
        run: |
          set -euo pipefail
          # The token was passed per command (git -c), never stored; prove no
          # checkout carries it before the bytes leave this job.
          if grep -rIl -e extraheader -e x-access-token "$RUNNER_TEMP"/birth-sources/*/.git/config >/dev/null 2>&1; then
            echo "a source checkout persisted credentials" >&2; exit 1
          fi
          tar -C "$RUNNER_TEMP/birth-sources" -czf "$RUNNER_TEMP/birth-sources.tgz" .
      - name: Upload source checkouts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: birth-sources-${{ inputs.repo_name }}
          path: ${{ runner.temp }}/birth-sources.tgz
          if-no-files-found: error
          retention-days: 1

  prepare:
    name: Prepare ${{ inputs.repo_name }}
    needs: source
    # A bare template birth skips the source job; any source failure stops here.
    if: ${{ !cancelled() && (needs.source.result == 'success' || needs.source.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      factory_sha: ${{ steps.factory.outputs.sha }}
      governance_sha: ${{ steps.governance.outputs.sha }}
      payload_sha: ${{ steps.payload.outputs.sha }}
      payload_bundle_sha: ${{ steps.payload.outputs.bundle_sha }}
      semantic_compiler_sha: ${{ steps.semantic_compiler.outputs.sha }}
      org_policy_sha: ${{ steps.org_policy.outputs.sha }}
      core_sha: ${{ steps.core.outputs.sha }}
      handoff_digest: ${{ steps.prepare_birth.outputs.handoff_digest }}
      root_sha: ${{ steps.prepare_birth.outputs.root_sha }}
      tree_sha: ${{ steps.prepare_birth.outputs.tree_sha }}
    steps:
      - name: Checkout factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Record factory SHA
        id: factory
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.12"
      - name: Sync locked factory dependencies
        run: uv sync --extra dev --frozen --no-install-project --no-build
      - name: Fetch organization policy at exact SHA
        id: org_policy
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/org-github"
          git clone --no-checkout https://github.com/Quantum-L9/.github.git "$dest"
          git -C "$dest" fetch --depth 1 origin main
          git -C "$dest" checkout --detach FETCH_HEAD
          echo "root=$dest" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C "$dest" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch Core at the revision org-ci runs
        id: core
        # The organization required workflow runs l9-ci-core org-ci.yml from
        # refs/heads/main, so a product is stamped from exactly that commit,
        # resolved here and recorded in the newborn's .l9/core-stamp.json.
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/l9-ci-core"
          git clone --no-checkout https://github.com/Quantum-L9/l9-ci-core.git "$dest"
          git -C "$dest" fetch --depth 1 origin main
          git -C "$dest" checkout --detach FETCH_HEAD
          echo "root=$dest" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C "$dest" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch governance
        id: governance
        continue-on-error: true
        env:
          GOV_REF: ${{ inputs.governance_ref }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/cursor-governance"
          ref="${GOV_REF:-main}"
          case "/$ref/" in */../*) echo "governance_ref must not contain '..'" >&2; exit 2;; esac
          git clone --no-checkout https://github.com/Quantum-L9/Cursor-Governance.git "$dest"
          git -C "$dest" fetch --depth 1 origin "$ref"
          git -C "$dest" checkout --detach FETCH_HEAD
          echo "root=$dest" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C "$dest" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Receive source checkouts from the source job
        if: inputs.payload_repo != ''
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: birth-sources-${{ inputs.repo_name }}
          path: ${{ runner.temp }}/birth-sources-in
      - name: Unpack payload as data
        id: payload
        if: inputs.payload_repo != ''
        env:
          PAYLOAD_SUBPATH: ${{ inputs.payload_subpath }}
          PAYLOAD_BUNDLE_REF: ${{ inputs.payload_bundle_ref }}
          PAYLOAD_CONTRACT_PATH: ${{ inputs.payload_contract_path }}
          PRODUCT_BINDING_PATH: ${{ inputs.product_birth_binding_path }}
          PRODUCT_MANIFEST_PATH: ${{ inputs.product_manifest_path }}
          EXPECTED_SHA: ${{ needs.source.outputs.payload_sha }}
          EXPECTED_BUNDLE_SHA: ${{ needs.source.outputs.payload_bundle_sha }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/birth-sources"
          mkdir -p "$src"
          tar -C "$src" --no-same-owner -xzf "$RUNNER_TEMP/birth-sources-in/birth-sources.tgz"
          dest="$src/payload-src"
          sha="$(git -C "$dest" rev-parse HEAD)"
          [ -n "$EXPECTED_SHA" ] && [ "$sha" = "$EXPECTED_SHA" ] || { echo "received payload is not the commit the source job fetched" >&2; exit 2; }
          for p in "$PAYLOAD_SUBPATH" "$PAYLOAD_CONTRACT_PATH" "$PRODUCT_BINDING_PATH" "$PRODUCT_MANIFEST_PATH"; do
            case "/$p/" in */../*) echo "payload paths must not contain '..'" >&2; exit 2;; esac
            case "$p" in /*) echo "payload paths must be relative" >&2; exit 2;; esac
          done
          root="$dest"; [ -z "$PAYLOAD_SUBPATH" ] || root="$dest/$PAYLOAD_SUBPATH"
          [ -d "$root" ] || { echo "payload_subpath is not a directory" >&2; exit 2; }
          bundle_dest=""; bundle_sha=""
          if [ -n "$PAYLOAD_BUNDLE_REF" ]; then
            bundle_dest="$src/payload-bundle"
            bundle_sha="$(git -C "$bundle_dest" rev-parse HEAD)"
            [ "$bundle_sha" = "$PAYLOAD_BUNDLE_REF" ] && [ "$bundle_sha" = "$EXPECTED_BUNDLE_SHA" ] || { echo "received bundle is not payload_bundle_ref" >&2; exit 2; }
          fi
          bundle_file() {
            [ -n "$1" ] || return 0
            resolved="$(realpath -e "$bundle_dest/$1")" || { echo "bundle artifact not found: $1" >&2; exit 2; }
            case "$resolved" in "$bundle_dest"/*) :;; *) echo "bundle artifact escapes the payload bundle checkout: $1" >&2; exit 2;; esac
            [ -f "$resolved" ] || { echo "bundle artifact is not a file: $1" >&2; exit 2; }
            printf '%s' "$resolved"
          }
          contract="$(bundle_file "$PAYLOAD_CONTRACT_PATH")"
          binding="$(bundle_file "$PRODUCT_BINDING_PATH")"
          manifest="$(bundle_file "$PRODUCT_MANIFEST_PATH")"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          echo "binding=$binding" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "bundle_sha=$bundle_sha" >> "$GITHUB_OUTPUT"
      - name: Unpack the pinned semantic compiler as data
        id: semantic_compiler
        if: inputs.product_birth_binding_path != ''
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.semantic_compiler_sha }}
        run: |
          set -euo pipefail
          # The pin is the factory's, read from the checked-out factory and
          # nowhere else; the checkout is proven again inside PREPARE.
          sha="$(.venv/bin/python -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["revision"])' scripts/birth-runner/semantic-compiler.pin.json)"
          dest="$RUNNER_TEMP/birth-sources/semantic-compiler"
          [ -d "$dest" ] || { echo "adapter-backed birth requires payload_repo: the pinned engine arrives with the source checkouts" >&2; exit 2; }
          test "$(git -C "$dest" rev-parse HEAD)" = "$sha" && test "$EXPECTED_SHA" = "$sha" || { echo "semantic compiler checkout is not the pinned revision" >&2; exit 2; }
          echo "root=$dest" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: PREPARE and seal without privileged birth authority
        id: prepare_birth
        env:
          BIRTH_ORG: ${{ github.repository_owner }}
          BIRTH_REPO: ${{ inputs.repo_name }}
          BIRTH_PKG: ${{ inputs.package_name }}
          BIRTH_DESC: ${{ inputs.description }}
          BIRTH_CLASS: ${{ inputs.repo_class }}
          BIRTH_VISIBILITY: ${{ inputs.visibility }}
          BIRTH_PAYLOAD: ${{ steps.payload.outputs.root }}
          BIRTH_PAYLOAD_CONTRACT: ${{ steps.payload.outputs.contract }}
          BIRTH_PRODUCT_BINDING: ${{ steps.payload.outputs.binding }}
          BIRTH_PRODUCT_MANIFEST: ${{ steps.payload.outputs.manifest }}
          BIRTH_SEMANTIC_COMPILER: ${{ steps.semantic_compiler.outputs.root }}
          BIRTH_CORE: ${{ steps.core.outputs.root }}
          BIRTH_ADAPTER_REQUESTED: ${{ inputs.product_birth_binding_path }}${{ inputs.product_manifest_path }}
          L9_GOV_ROOT: ${{ steps.governance.outputs.root }}
          L9_BIRTH_GOVERNANCE_SHA: ${{ steps.governance.outputs.sha }}
          L9_BIRTH_PAYLOAD_REPOSITORY: ${{ inputs.payload_repo }}
          L9_BIRTH_PAYLOAD_REQUESTED_REF: ${{ inputs.payload_ref }}
          L9_BIRTH_PAYLOAD_RESOLVED_SHA: ${{ steps.payload.outputs.sha }}
          L9_BIRTH_PAYLOAD_BUNDLE_SHA: ${{ steps.payload.outputs.bundle_sha }}
          ORG_POLICY_ROOT: ${{ steps.org_policy.outputs.root }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN L9_BIRTH_PRIVILEGED_TOKEN
          # Adapter inputs are resolved only inside the payload checkout. Asked
          # for but not resolved (no payload_repo) is a refusal, never a generic birth.
          if [ -n "$BIRTH_ADAPTER_REQUESTED" ] && [ -z "${BIRTH_PRODUCT_BINDING:-}${BIRTH_PRODUCT_MANIFEST:-}" ]; then
            echo "adapter-backed birth requires payload_repo: its artifacts are read from the payload checkout" >&2
            exit 2
          fi
          if [ -n "$BIRTH_ADAPTER_REQUESTED" ] && [ -z "${BIRTH_SEMANTIC_COMPILER:-}" ]; then
            echo "adapter-backed birth requires the pinned semantic compiler checkout" >&2
            exit 2
          fi
          args=(prepare --repo "$BIRTH_REPO" --pkg "$BIRTH_PKG" --desc "$BIRTH_DESC" --org "$BIRTH_ORG" --work-dir "$RUNNER_TEMP/births" --handoff "$RUNNER_TEMP/birth-handoff.json" --org-profile-src "$ORG_POLICY_ROOT")
          [ -z "$BIRTH_CLASS" ] || args+=(--repo-class "$BIRTH_CLASS")
          [ "$BIRTH_VISIBILITY" != private ] || args+=(--private)
          [ -z "${BIRTH_PAYLOAD:-}" ] || args+=(--payload "$BIRTH_PAYLOAD")
          [ -z "${BIRTH_PAYLOAD_CONTRACT:-}" ] || args+=(--payload-contract "$BIRTH_PAYLOAD_CONTRACT")
          [ -z "${BIRTH_PRODUCT_BINDING:-}" ] || args+=(--product-birth-binding "$BIRTH_PRODUCT_BINDING")
          [ -z "${BIRTH_PRODUCT_MANIFEST:-}" ] || args+=(--product-manifest "$BIRTH_PRODUCT_MANIFEST")
          [ -z "${BIRTH_SEMANTIC_COMPILER:-}" ] || args+=(--semantic-compiler-src "$BIRTH_SEMANTIC_COMPILER")
          [ -z "${BIRTH_CORE:-}" ] || args+=(--core-src "$BIRTH_CORE")
          .venv/bin/python -I scripts/birth-runner/birth_boundary.py "${args[@]}"
          tar -C "$RUNNER_TEMP/births" -czf "$RUNNER_TEMP/sealed-birth.tgz" "$BIRTH_REPO"
      - name: Record source provenance
        env:
          FACTORY_SHA: ${{ steps.factory.outputs.sha }}
          ORG_POLICY_SHA: ${{ steps.org_policy.outputs.sha }}
          GOVERNANCE_SHA: ${{ steps.governance.outputs.sha }}
          PAYLOAD_REQUESTED_REF: ${{ inputs.payload_ref }}
          PAYLOAD_SHA: ${{ steps.payload.outputs.sha }}
          PAYLOAD_BUNDLE_SHA: ${{ steps.payload.outputs.bundle_sha }}
          SEMANTIC_COMPILER_SHA: ${{ steps.semantic_compiler.outputs.sha }}
          CORE_SHA: ${{ steps.core.outputs.sha }}
          HANDOFF_DIGEST: ${{ steps.prepare_birth.outputs.handoff_digest }}
          ROOT_SHA: ${{ steps.prepare_birth.outputs.root_sha }}
          TREE_SHA: ${{ steps.prepare_birth.outputs.tree_sha }}
        run: |
          {
            echo "### Sealed birth provenance"
            echo "- factory: $FACTORY_SHA"
            echo "- organization policy: $ORG_POLICY_SHA"
            echo "- governance: $GOVERNANCE_SHA"
            echo "- payload requested ref: $PAYLOAD_REQUESTED_REF"
            echo "- payload resolved SHA: $PAYLOAD_SHA"
            echo "- payload bundle SHA: $PAYLOAD_BUNDLE_SHA"
            echo "- semantic compiler (pinned): $SEMANTIC_COMPILER_SHA"
            echo "- Core (org-ci main): $CORE_SHA"
            echo "- handoff digest: $HANDOFF_DIGEST"
            echo "- root SHA: $ROOT_SHA"
            echo "- tree SHA: $TREE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sealed birth handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sealed-birth-${{ inputs.repo_name }}
          path: |
            ${{ runner.temp }}/birth-handoff.json
            ${{ runner.temp }}/sealed-birth.tgz
          if-no-files-found: error

  publish:
    name: Publish ${{ inputs.repo_name }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: repo-birth
    timeout-minutes: 30
    steps:
      - name: Checkout trusted factory at PREPARE SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.factory_sha }}
      - name: Verify trusted factory SHA
        env:
          EXPECTED_FACTORY_SHA: ${{ needs.prepare.outputs.factory_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_FACTORY_SHA"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.12"
      - name: Build trusted factory environment
        run: uv sync --extra dev --frozen --no-install-project --no-build
      - name: Download sealed birth handoff
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: sealed-birth-${{ inputs.repo_name }}
          path: ${{ runner.temp }}/sealed-input
      - name: Materialize sealed birth artifact as data
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/births"
          tar -C "$RUNNER_TEMP/births" -xzf "$RUNNER_TEMP/sealed-input/sealed-birth.tgz"
          cp "$RUNNER_TEMP/sealed-input/birth-handoff.json" "$RUNNER_TEMP/birth-handoff.json"
      - name: Verify sealed artifact against PREPARE job outputs
        env:
          EXPECTED_HANDOFF_DIGEST: ${{ needs.prepare.outputs.handoff_digest }}
          EXPECTED_ROOT_SHA: ${{ needs.prepare.outputs.root_sha }}
          EXPECTED_TREE_SHA: ${{ needs.prepare.outputs.tree_sha }}
          BIRTH_REPO: ${{ inputs.repo_name }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN L9_BIRTH_PRIVILEGED_TOKEN
          .venv/bin/python -I scripts/birth-runner/birth_boundary.py verify \
            --handoff "$RUNNER_TEMP/birth-handoff.json" \
            --root "$RUNNER_TEMP/births/$BIRTH_REPO" \
            --expected-handoff-digest "$EXPECTED_HANDOFF_DIGEST" \
            --expected-root-sha "$EXPECTED_ROOT_SHA" \
            --expected-tree-sha "$EXPECTED_TREE_SHA"
      - name: Bind trusted control-plane executables before authority exists
        run: |
          set -euo pipefail
          git_path="$(realpath "$(command -v git)")"
          gh_path="$(realpath "$(command -v gh)")"
          for tool in "$git_path" "$gh_path"; do
            case "$tool" in
              "$RUNNER_TEMP"/*|"$GITHUB_WORKSPACE"/*)
                echo "refusing control-plane executable from mutable workspace: $tool" >&2
                exit 1
                ;;
            esac
          done
          control_path="$(dirname "$git_path"):$(dirname "$gh_path")"
          echo "L9_BIRTH_CONTROL_PATH=$control_path" >> "$GITHUB_ENV"
      - name: Mint privileged publication token after verification
        id: publish_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.BIRTH_APP_ID }}
          private-key: ${{ secrets.BIRTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-contents: write
          permission-actions: write
          permission-issues: write
      - name: PUBLISH exact sealed root and remotely attest
        env:
          L9_BIRTH_PRIVILEGED_TOKEN: ${{ steps.publish_token.outputs.token }}
          L9_BIRTH_CI_UNVERIFIED: ${{ inputs.ci_unverified_reason }}
          BIRTH_REPO: ${{ inputs.repo_name }}
        run: |
          set -euo pipefail
          export PATH="$L9_BIRTH_CONTROL_PATH"
          .venv/bin/python -I scripts/birth-runner/birth_boundary.py publish --handoff "$RUNNER_TEMP/birth-handoff.json" --root "$RUNNER_TEMP/births/$BIRTH_REPO"
      - name: Upload final birth evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: birth-evidence-${{ inputs.repo_name }}
          path: |
            ${{ runner.temp }}/birth-handoff.json
            ${{ runner.temp }}/births/${{ inputs.repo_name }}-birth-receipt.json
          if-no-files-found: warn

  activate:
    # ACTIVATE (post-PUBLISH). The meta-injector and the topology compiler run
    # against the PUBLISHED root, because both bind to a commit that exists on
    # GitHub: the governed metadata commit, then its topology packet. The branch
    # carrying them is the newborn's first pull request, which the organization
    # required workflow evaluates (the BORN evidence). One call site:
    # scripts/birth-runner/birth_activation.py; tools pinned in activation.pin.json.
    name: Activate ${{ inputs.repo_name }}
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    environment: repo-birth
    timeout-minutes: 30
    steps:
      - name: Checkout trusted factory at PREPARE SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.factory_sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.12"
      - name: Build trusted factory environment
        run: uv sync --extra dev --frozen --no-install-project --no-build
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13"
      - name: Fetch the organization Semantic Foundation the birth used (full history)
        id: org
        env:
          ORG_POLICY_SHA: ${{ needs.prepare.outputs.org_policy_sha }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/activation/org-github"
          git clone https://github.com/Quantum-L9/.github.git "$dest"
          git -C "$dest" checkout --detach "$ORG_POLICY_SHA"
          echo "root=$dest" >> "$GITHUB_OUTPUT"
      - name: Build the pinned meta-injector and topology compiler
        id: tools
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/activation"
          pin() { .venv/bin/python -I -c 'import json,sys; d=json.load(open("scripts/birth-runner/activation.pin.json"))[sys.argv[1]]; print(d["repository"], d["revision"])' "$1"; }
          fetch() {
            local repo="${1% *}" sha="${1#* }" dest="$2"
            git clone --no-checkout "https://github.com/${repo}.git" "$dest"
            git -C "$dest" fetch --depth 1 origin "$sha"
            git -C "$dest" checkout --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$sha" || { echo "$repo is not at the pinned $sha" >&2; exit 2; }
          }
          fetch "$(pin meta_injector)" "$base/l9-meta-injector"
          (cd "$base/l9-meta-injector" && npm ci --no-audit --no-fund && npm run build)
          fetch "$(pin constellation_topology)" "$base/l9-constellation-topology"
          uv venv --python 3.12 "$base/topology-venv"
          VIRTUAL_ENV="$base/topology-venv" uv pip install "$base/l9-constellation-topology"
          echo "injector=$base/l9-meta-injector" >> "$GITHUB_OUTPUT"
          echo "topology=$base/l9-constellation-topology" >> "$GITHUB_OUTPUT"
          echo "topology_cli=$base/topology-venv/bin/l9-topology" >> "$GITHUB_OUTPUT"
      - name: Mint activation token for the newborn and Gate
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.BIRTH_APP_ID }}
          private-key: ${{ secrets.BIRTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ inputs.repo_name }}
            Constellation.Gate
          permission-contents: write
          permission-pull-requests: write
      - name: Clone the published root
        id: newborn
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          ROOT_SHA: ${{ needs.prepare.outputs.root_sha }}
          OWNER: ${{ github.repository_owner }}
          BIRTH_REPO: ${{ inputs.repo_name }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/activation/newborn"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.extraheader=$header" clone "https://github.com/$OWNER/$BIRTH_REPO.git" "$dest"
          test "$(git -C "$dest" rev-parse HEAD)" = "$ROOT_SHA" || { echo "published head is not the sealed root" >&2; exit 2; }
          git -C "$dest" switch -c l9/activation
          if [ -f "$dest/product-topology.yaml" ]; then echo "declared=1" >> "$GITHUB_OUTPUT"; else echo "declared=0" >> "$GITHUB_OUTPUT"; fi
          echo "root=$dest" >> "$GITHUB_OUTPUT"
      - name: ACTIVATE (meta-injector apply/check, repository model, topology packet)
        if: steps.newborn.outputs.declared == '1'
        env:
          OWNER: ${{ github.repository_owner }}
          BIRTH_REPO: ${{ inputs.repo_name }}
          NEWBORN: ${{ steps.newborn.outputs.root }}
          ORG_ROOT: ${{ steps.org.outputs.root }}
          INJECTOR: ${{ steps.tools.outputs.injector }}
          TOPOLOGY_CLI: ${{ steps.tools.outputs.topology_cli }}
          TOPOLOGY_ROOT: ${{ steps.tools.outputs.topology }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          .venv/bin/python -I scripts/birth-runner/birth_activation.py \
            --newborn "$NEWBORN" \
            --repository "$OWNER/$BIRTH_REPO" \
            --org-root "$ORG_ROOT" \
            --injector "$INJECTOR" \
            --topology-cli "$TOPOLOGY_CLI" \
            --topology-root "$TOPOLOGY_ROOT" \
            --work "$RUNNER_TEMP/activation/work" \
            --receipt "$RUNNER_TEMP/activation/activation-receipt.json"
      - name: Open the newborn's first pull request
        if: steps.newborn.outputs.declared == '1'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          BIRTH_REPO: ${{ inputs.repo_name }}
          NEWBORN: ${{ steps.newborn.outputs.root }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          dest="$NEWBORN"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$dest" -c "http.extraheader=$header" push origin l9/activation
          gh api -X POST "repos/$OWNER/$BIRTH_REPO/pulls" \
            -f title="chore(activation): governed metadata and topology packet" \
            -f head=l9/activation -f base=main \
            -f body="Post-PUBLISH activation by the birth factory: l9-meta-injector apply/check, repository model and Constellation topology packet (.l9/topology-packet). Receipt: workflow run $RUN_ID."
      - name: Propose the node's Gate action registration
        if: steps.newborn.outputs.declared == '1'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          BIRTH_REPO: ${{ inputs.repo_name }}
          NEWBORN: ${{ steps.newborn.outputs.root }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          newborn="$NEWBORN"
          kind="$(.venv/bin/python -I -c 'import sys,yaml; d=yaml.safe_load(open(sys.argv[1])); p=d.get("product") or {}; print(p.get("kind","") if (d.get("interfaces") or {}).get("actions") else "")' "$newborn/product-topology.yaml")"
          if [ "$kind" != node ]; then echo "no public node actions to register"; exit 0; fi
          gate="$RUNNER_TEMP/activation/gate"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$header" clone --depth 1 "https://github.com/$OWNER/Constellation.Gate.git" "$gate"
          fixture="constellation-gate/tests/fixtures/node_topologies/$BIRTH_REPO.product-topology.yaml"
          cp "$newborn/product-topology.yaml" "$gate/$fixture"
          # Gate's own deterministic generator; Gate stays the routing authority.
          if (cd "$gate/constellation-gate" && "$GITHUB_WORKSPACE/.venv/bin/python" scripts/register_node_actions.py check --product-topology "tests/fixtures/node_topologies/$BIRTH_REPO.product-topology.yaml") \
             && git -C "$gate" diff --quiet; then
            echo "Gate already registers $BIRTH_REPO exactly"; exit 0
          fi
          (cd "$gate/constellation-gate" && "$GITHUB_WORKSPACE/.venv/bin/python" scripts/register_node_actions.py generate --product-topology "tests/fixtures/node_topologies/$BIRTH_REPO.product-topology.yaml")
          branch="birth/register-$BIRTH_REPO"
          git -C "$gate" switch -c "$branch"
          git -C "$gate" add -- "$fixture" "constellation-gate/src/constellation_gate/config/node_actions/$BIRTH_REPO.json"
          git -C "$gate" -c user.name="l9-repo-birth[bot]" -c user.email="l9-repo-birth[bot]@users.noreply.github.com" commit -q -m "feat(routing): register $BIRTH_REPO public actions from its product topology"
          git -C "$gate" -c "http.extraheader=$header" push origin "$branch"
          gh api -X POST "repos/$OWNER/Constellation.Gate/pulls" \
            -f title="feat(routing): register $BIRTH_REPO public actions" \
            -f head="$branch" -f base=main \
            -f body="Generated by the birth factory from $OWNER/$BIRTH_REPO product-topology.yaml with scripts/register_node_actions.py. Workflow run $RUN_ID."
      - name: Upload activation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: birth-activation-${{ inputs.repo_name }}
          path: ${{ runner.temp }}/activation/activation-receipt.json
          if-no-files-found: warn

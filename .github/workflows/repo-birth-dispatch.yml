name: Repo birth (dispatch)

# Birth a repository from a surface that holds no create-repo authority.
#
# Claude Code on the web and on mobile reach GitHub through a proxy that binds a
# session to its configured repositories: `POST /orgs/{org}/repos` is not a
# `repos/{owner}/{repo}/...` path, so `gh repo create` — and therefore stage 6,
# `stage_create` in scripts/birth-runner/new_repo.py — is unreachable there. A
# runner is not behind that proxy. This workflow is the second half of a
# deliberate two-step: the agent dispatches, the runner creates.
#
# It orchestrates birth; it is NOT CI. No job here declares a `uses:` naming a
# Quantum-L9 CI workflow, so `canonical_ci.discover_bindings()` finds no binding
# to authorize and the CI ownership boundary in docs/ops/REPO_BIRTH.md is
# untouched. A newborn still ships no CI workflow of its own — that remains
# correct, and this file lives in the template, never in a newborn.
#
# The runner does not re-implement any birth stage. It calls `make new-repo`,
# the same entrypoint a desktop operator calls, so the one-operation invariant
# of stage 6 — create the remote, create `origin`, push the root commit — stays
# inside new_repo.py where it belongs.

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Repository name, no owner prefix"
        required: true
        type: string
      package_name:
        description: "snake_case Python package name"
        required: true
        type: string
      description:
        description: "One-line repository description"
        required: true
        type: string
      visibility:
        description: "Repository visibility"
        required: true
        type: choice
        options:
          - private
          - public
        default: private
      repo_class:
        description: "Org repo class — blank uses the runner default"
        required: false
        type: string
      ci_unverified_reason:
        description: >-
          Accept an unenrolled repository, with a reason. Blank fails closed at
          stage 9 and leaves the repository QUARANTINED but preserved. See
          docs/ops/REPO_BIRTH.md, "Enrolment status".
        required: false
        type: string
      payload_repo:
        description: >-
          owner/name of the repository holding the product bytes. Blank births
          the bare template. Must be in this organisation.
        required: false
        type: string
      payload_ref:
        description: >-
          Branch, tag, or commit SHA in payload_repo. Required when payload_repo
          is set; a SHA is what makes the birth reproducible.
        required: false
        type: string
      payload_subpath:
        description: >-
          Directory inside the payload checkout to use as the payload. Blank
          uses the checkout root.
        required: false
        type: string
      payload_contract_path:
        description: >-
          Path inside the payload checkout to a compiled l9.birth-payload/v1.
          Required only for a repository-shaped payload, which is authoritative
          over its product tree; an additive fragment needs none.
        required: false
        type: string

# The workflow's own GITHUB_TOKEN needs nothing beyond reading this checkout.
# Every act of authority uses the App installation token minted below, so
# narrowing this does not narrow the birth.
permissions:
  contents: read

# Two births of the same name must not race: the loser fails
# `_preflight_name_free` at best, and interleaves two root commits at worst.
concurrency:
  group: repo-birth-${{ inputs.repo_name }}
  cancel-in-progress: false

jobs:
  birth:
    name: Birth ${{ inputs.repo_name }}
    runs-on: ubuntu-latest
    # Environment `repo-birth` holds BIRTH_APP_ID and BIRTH_APP_PRIVATE_KEY and
    # is restricted to `main`. That restriction is the control stopping a fork
    # or a feature branch from minting an org-administration token.
    environment: repo-birth
    timeout-minutes: 30

    steps:
      - name: Checkout template
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: "3.12"

      - name: Sync locked dependencies
        # canonical_ci.py imports yaml; the rest of the birth runner is stdlib.
        # `uv sync` creates .venv, which Repo.mk then prefers over python3.
        #
        # `--frozen` installs what uv.lock resolved instead of re-resolving at
        # run time, and `--no-build` refuses source distributions, so no
        # dependency's setup script executes on a runner that is holding an
        # organisation-Administration token. `--no-install-project` because the
        # birth runner is standalone scripts under scripts/birth-runner: it
        # imports yaml and its own modules by path, never the example package.
        # Verified on a real local birth under exactly this venv.
        run: uv sync --extra dev --frozen --no-install-project --no-build

      - name: Mint installation token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BIRTH_APP_ID }}
          private-key: ${{ secrets.BIRTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Fetch the payload
        # A payload is product bytes from somewhere else, so it arrives as a
        # pinned git checkout rather than an archive URL: that is the shape
        # compile_birth_payload.py already requires of a source ("clean checkout
        # of the source repository", identity read from `origin`), and it is the
        # only shape whose contents are attributable to a commit.
        #
        # Same-organisation only. This job holds an organisation-Administration
        # token, and a birth that could pull an arbitrary third-party tree into
        # the newborn's root commit under that token is a supply-chain hole, not
        # a feature. The App is installed on this org, so a foreign repo would
        # fail to clone anyway — this fails it earlier, and on purpose.
        id: payload
        if: inputs.payload_repo != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PAYLOAD_REPO: ${{ inputs.payload_repo }}
          PAYLOAD_REF: ${{ inputs.payload_ref }}
          PAYLOAD_SUBPATH: ${{ inputs.payload_subpath }}
          PAYLOAD_CONTRACT_PATH: ${{ inputs.payload_contract_path }}
          BIRTH_ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          case "$PAYLOAD_REPO" in
            */*/*|"") echo "payload_repo must be owner/name" >&2; exit 2 ;;
            "$BIRTH_ORG"/*) : ;;
            *) echo "payload_repo must be in $BIRTH_ORG (got $PAYLOAD_REPO)" >&2; exit 2 ;;
          esac
          if [ -z "$PAYLOAD_REF" ]; then
            echo "payload_ref is required when payload_repo is set" >&2
            exit 2
          fi
          # `..` in either path would resolve outside the checkout and hand
          # `make new-repo` a directory of runner files to copy into the
          # newborn's root commit. Reject the segment rather than normalising.
          for p in "$PAYLOAD_SUBPATH" "$PAYLOAD_CONTRACT_PATH"; do
            case "/$p/" in
              */../*) echo "payload paths must not contain '..' (got '$p')" >&2; exit 2 ;;
              //*) : ;;
            esac
            case "$p" in
              /*) echo "payload paths must be relative (got '$p')" >&2; exit 2 ;;
            esac
          done

          dest="$RUNNER_TEMP/payload-src"
          git clone --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${PAYLOAD_REPO}.git" "$dest"
          # Drop the credential out of .git/config immediately. `.git` is
          # excluded from the copy, so this is defence in depth rather than the
          # only thing standing between the token and the newborn.
          git -C "$dest" remote set-url origin "https://github.com/${PAYLOAD_REPO}.git"
          git -C "$dest" -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch --depth 1 origin "$PAYLOAD_REF"
          git -C "$dest" checkout --detach FETCH_HEAD
          sha="$(git -C "$dest" rev-parse HEAD)"

          root="$dest"
          if [ -n "$PAYLOAD_SUBPATH" ]; then
            root="$dest/$PAYLOAD_SUBPATH"
          fi
          if [ ! -d "$root" ]; then
            echo "payload_subpath '$PAYLOAD_SUBPATH' is not a directory in $PAYLOAD_REPO@$sha" >&2
            exit 2
          fi

          contract=""
          if [ -n "$PAYLOAD_CONTRACT_PATH" ]; then
            contract="$dest/$PAYLOAD_CONTRACT_PATH"
            if [ ! -f "$contract" ]; then
              echo "payload_contract_path '$PAYLOAD_CONTRACT_PATH' is not a file in $PAYLOAD_REPO@$sha" >&2
              exit 2
            fi
          fi

          # The resolved SHA is the reproducibility record: payload_ref may be a
          # moving branch, this is what was actually assembled.
          {
            echo "root=$root"
            echo "contract=$contract"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "payload: ${PAYLOAD_REPO}@${sha}" >> "$GITHUB_STEP_SUMMARY"

      - name: Birth the repository
        # Every dispatch input arrives through `env`, never interpolated into
        # the script body: `${{ inputs.description }}` inside a `run:` is a
        # shell-injection sink, and a description is free text.
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          BIRTH_ORG: ${{ github.repository_owner }}
          BIRTH_REPO: ${{ inputs.repo_name }}
          BIRTH_PKG: ${{ inputs.package_name }}
          BIRTH_DESC: ${{ inputs.description }}
          BIRTH_CLASS: ${{ inputs.repo_class }}
          BIRTH_VISIBILITY: ${{ inputs.visibility }}
          # Empty is not an authorization: new_repo.py strips this and fails
          # closed on a blank value, so exporting it unconditionally is safe.
          L9_BIRTH_CI_UNVERIFIED: ${{ inputs.ci_unverified_reason }}
          BIRTH_PAYLOAD: ${{ steps.payload.outputs.root }}
          BIRTH_PAYLOAD_CONTRACT: ${{ steps.payload.outputs.contract }}
        run: |
          set -euo pipefail

          args=(
            REPO="$BIRTH_REPO"
            PKG="$BIRTH_PKG"
            DESC="$BIRTH_DESC"
            ORG="$BIRTH_ORG"
            RECEIPT="$GITHUB_WORKSPACE/birth-receipt.json"
          )
          # Both empty on a bare birth: the fetch step did not run, so its
          # outputs are unset and this is the same command as before.
          if [ -n "${BIRTH_PAYLOAD:-}" ]; then
            args+=(PAYLOAD="$BIRTH_PAYLOAD")
          fi
          if [ -n "${BIRTH_PAYLOAD_CONTRACT:-}" ]; then
            args+=(PAYLOAD_CONTRACT="$BIRTH_PAYLOAD_CONTRACT")
          fi
          if [ "$BIRTH_VISIBILITY" = "private" ]; then
            args+=(PRIVATE=1)
          fi
          if [ -n "$BIRTH_CLASS" ]; then
            args+=(CLASS="$BIRTH_CLASS")
          fi

          make new-repo "${args[@]}"

      - name: Upload birth receipt
        # Unconditional. A QUARANTINED birth publishes the repository and exits
        # non-zero; its receipt is the only record of why, so it must survive
        # the failure that produced it.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: birth-receipt-${{ inputs.repo_name }}
          path: birth-receipt.json
          if-no-files-found: warn

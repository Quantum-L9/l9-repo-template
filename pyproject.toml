[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l9-example-pkg"
version = "0.1.0"
description = "Quantum-L9 Python GitHub Template — non-Constellation museum example"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
retry = ["tenacity>=9.0.0"]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff==0.16.1",
  "pyyaml>=6.0.2",
  "jsonschema==4.26.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tools/l9_repo"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["l9_example_pkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[[tool.mypy.overrides]]
module = ["tenacity"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pydantic_settings", "pydantic_settings.*", "fastapi", "fastapi.*", "starlette.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "l9_example_pkg.settings"
disable_error_code = ["misc"]


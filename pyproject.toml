[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l9-example-pkg"
version = "0.1.0"
description = "L9 Python GitHub Template — Gate-routed worker head-start"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "constellation-node-sdk @ git+https://github.com/Quantum-L9/Gate_SDK.git@1d52369cfdfa5eea13e8abde32c915a9834befcc",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "pytest-asyncio>=0.24.0",
  "ruff==0.16.1",
  "pyyaml>=6.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["l9_example_pkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: fast unit tests",
  "integration: integration tests",
]

schema: l9.architecture-spec/v1
metadata:
  repository: Quantum-L9/l9-repo-template
  status: authoritative
  role: l9-repo-birth-factory
identity:
  role: l9-repo-birth-factory
  description: >
    Generic L9 repository birth factory. Owns HOW an L9 repository is born:
    deterministic assembly, chassis application, compiled-payload production
    and verification, birth provenance, lifecycle orchestration, local
    pre-publication validation, publication of the sealed root, invocation of
    organization-owned bootstrap, and remote attestation. It does not own WHAT
    semantic product is being born.
product_semantics:
  position: upstream_input
  rule: >
    ProductTopology, ProductManifest, ProductKind and node/dependency archetype
    semantics are owned upstream (Quantum-L9/.github semantics/ and the product
    semantic owner) and arrive as resolved inputs. This repository never infers
    ProductKind from repository shape, package contents, SDK presence, Gate
    presence, repo class, or template ancestry.
  owner: Quantum-L9/.github
  references:
    - semantics/product_kinds.yaml
    - semantics/node_archetypes.yaml
    - semantics/product_topology.schema.yaml
    - semantics/product_manifest.schema.yaml
reference_payload:
  description: >
    The Python/FastAPI content under src/, tests/, Dockerfile, docker-compose
    and observability/ is a reference/example product payload. It demonstrates
    the chassis; it is not factory law and does not constrain the product kinds
    the factory can birth.
  ownership_contract: scripts/birth-runner/payload-ownership.yaml
boundaries:
  owns:
    - deterministic repository assembly and template/chassis application
    - compiled birth-payload production and verification (l9.birth-payload/v1)
    - repository-birth packaging and the l9.product-birth-binding/v2 schema
      (scripts/birth-runner/package_birth_handoff.py)
    - compiler-backed product resolution — pinning and invoking the semantic
      compiler engine, never interpreting its output
      (scripts/birth-runner/product_resolution.py, semantic-compiler.pin.json)
    - additive versus authoritative payload application
    - repository birth provenance and lifecycle orchestration
    - local pre-publication validation
    - repository creation, root publication and remote birth attestation
    - invocation of organization-owned bootstrap capabilities
    - Repo.mk product force-multipliers for the reference payload
  does_not_own:
    - ProductTopology / ProductManifest / ProductKind / archetype semantics
    - domain architecture, domain code generation, semantic compilation
    - organization governance policy and repo-class taxonomy (Quantum-L9/.github)
    - CI execution semantics, Gate semantics, SDK semantics, provider selection
    - Cursor-Governance control plane implementation
    - organization CI distribution, targeting, versioning, or enforcement
adapter_boundary:
  status: implemented
  adapter: scripts/birth-runner/l9_birth_adapter.py
  packager: scripts/birth-runner/package_birth_handoff.py
  prepare_gate: scripts/birth-runner/new_repo_legacy.py::_preflight_product_birth_adapter
  resolution: scripts/birth-runner/product_resolution.py
  engine_pin: scripts/birth-runner/semantic-compiler.pin.json
  rule: >
    The adapter decides whether a compiler-resolved product realization is
    admissible for this exact birth; the packager emits that bundle from a
    clean source snapshot and the ProductManifest the pinned semantic compiler
    resolves from it; PREPARE refuses assembly unless the adapter admits it for
    the running factory and the pinned compiler, re-run against the verified
    payload, reproduces the supplied manifest exactly. No IdeaOS, GAR, Plan,
    campaign or Program Execution lineage is a birth prerequisite
    (BIRTH-ARCH-REVISION-001). All of them consume resolved product semantics
    and none produces them: ProductManifest, ProductKind and archetypes stay
    upstream inputs, and the compiler's output is compared, never interpreted.
org_birth_profile:
  class: non_constellation_python
  meaning: >
    Current organization birth/distribution class of this repository under the
    presently admitted Quantum-L9/.github repo-class taxonomy. It is not a
    ProductKind and does not describe the products this factory births.
  authority: Quantum-L9/.github
  contract: policies/repo-classes.yml
  marker: .l9/org-birth-profile.yaml
ci_ownership:
  execution_semantics: Quantum-L9/l9-ci-core
  organization_control: Quantum-L9/l9-ci-control-plane
  organization_defaults: Quantum-L9/.github
  distribution_model: repository_must_not_distribute_org_ci

schema: l9.ownership-spec/v1
repository: Quantum-L9/l9-repo-template
museum_owns:
  - src/ worker package and handlers
  - Repo.mk product targets
  - scripts/ verify helpers
  - observability/ optional local compose
core_runtime_owns:
  - tools/l9_repo/ (vendored)
  - .l9/repo-workflow.json contract shape
cursor_governance_owns:
  - pr-check gate shape when invoked via gov-*
  - wiring / ide-profile / autonomy-validate / secrets

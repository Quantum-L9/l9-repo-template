schema: l9.ownership-spec/v1
repository: Quantum-L9/l9-repo-template
factory_owns:
  - scripts/birth-runner/ birth engine, payload compiler/verifier, provenance, lifecycle
  - scripts/ verify / hygiene / rule rendering / config reconciliation
  - Repo.mk product targets
  - src/ reference example payload and optional helpers
  - observability/ optional local compose (reference payload)
upstream_owns:
  product_semantics: Quantum-L9/.github semantics/ (ProductTopology, ProductManifest, ProductKind, archetypes)
  product_meaning: the product semantic owner of each born repository
  org_repo_class_taxonomy: Quantum-L9/.github policies/repo-classes.yml + ops/repo-class-profile.js
core_runtime_owns:
  - tools/l9_repo/ (vendored)
  - .l9/repo-workflow.json contract shape
ci_ownership:
  repository: local execution contract (.l9/repo-workflow.json + make ci)
  execution_semantics: Quantum-L9/l9-ci-core
  organization_control: Quantum-L9/l9-ci-control-plane
  organization_defaults: Quantum-L9/.github
  distribution_model: repository_must_not_distribute_org_ci
cursor_governance_owns:
  - pr-check gate shape when invoked via gov-*
  - wiring / ide-profile / autonomy-validate / secrets

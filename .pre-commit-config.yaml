# --- L9_META ---
# l9_schema: 1
# origin: l9-ci-universal-base
# layer: [governance]
# tags: [L9_TEMPLATE, precommit]
# owner: platform
# status: active
# --- /L9_META ---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
        exclude: ^\.github/.*\.ya?ml$
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["protect", "--staged", "--config=.gitleaks.toml"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --follow-imports=silent]
        additional_dependencies: [pydantic, pydantic-settings, types-PyYAML, structlog]

  - repo: local
    hooks:
      - id: l9-packet-envelope-prohibited
        name: "L9: TransportPacket contract"
        entry: l9-ci check-transport-packet
        language: system
        types: [python]
        pass_filenames: true
      - id: l9-check-deprecated-api
        name: "L9: deprecated API check"
        entry: l9-ci check-deprecated-api
        language: system
        types: [python]
        pass_filenames: true
      - id: l9-fix-deprecated-api
        name: "L9: deprecated API fixer"
        entry: l9-ci fix-deprecated-api
        language: system
        types: [python]
        pass_filenames: true
      - id: l9-terminology-guard
        name: "L9: terminology guard"
        entry: l9-ci terminology-guard . --include app --include engine --include tests
        language: system
        pass_filenames: false
      - id: pytest-unit
        name: pytest unit tests
        entry: bash -c 'PYTHONPATH="${PYTHONPATH}:." python -m pytest tests/ -m "unit" --tb=short -q'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

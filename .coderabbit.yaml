language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: [main]
  instructions: |
    Review this repository against its L9 authority surfaces before suggesting changes.
    Read AGENTS.md first, then .l9/architecture.yaml, .l9/ownership.yaml,
    .l9/sdk-compatibility.yaml, and CLAUDE.md when Claude-specific instructions apply.

    Treat machine-readable .l9 contracts as higher authority than narrative guidance.
    Flag duplicated CI/governance implementations, weakened validation, dependency
    drift between pyproject.toml and uv.lock, secret exposure, destructive Git behavior,
    and changes that make the birth factory classify product semantics it does not own.

    This repository is the generic L9 repository birth factory. ProductKind,
    ProductTopology, ProductManifest and archetype semantics are upstream inputs owned
    by Quantum-L9/.github and the product semantic owner. Do not require or forbid
    Node, Dependency, Gate or SDK surfaces based on repository shape, and flag any
    check that infers product kind from shape, package contents, SDK presence, Gate
    presence, repo class or template ancestry.
chat:

# Gate node registration spec (GATE_NODE_SPEC_PATH).
# After `make rename PKG=foo_bar`, update id/actions/internal_url.

node:
  id: l9-example-pkg
  actions:
    - example
  internal_url: http://l9-example-pkg:8000
  priority_class: P2
  max_concurrent: 50
  health_endpoint: /v1/health
  timeout_ms: 30000
  version: 0.1.0
  type: worker
